# Android APK — зөвхөн гараар (Actions → Run workflow) эсвэл `apk` branch руу push хийхэд.
# Үр дүн: GitHub Release (tag apk-<дугаар>)-д app-release.apk хавсаргана.
# Supabase / Google тохиргоог repo secrets-ээс авна; байхгүй бол "туршилтын build" болно.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Hosted Supabase (project "together"). Anon key нь нийтэд ил байх зориулалттай (RLS хамгаална).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ttkvvclhtcngushymdkc.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0a3Z2Y2xodGNuZ3VzaHltZGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTQxOTgsImV4cCI6MjEwOTA5MDE5OH0.T-ni1pD-LJ3yxssXRlVX6NUcqvCQzNEdNhc3ZOCbTU0' }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS }}
      LOG: ${{ github.workspace }}/build.log
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund 2>&1 | tee -a "$LOG"

      - name: Align Expo SDK versions
        working-directory: apps/mobile
        run: npx expo install --fix 2>&1 | tee -a "$LOG"

      - name: Check JS bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/export-check 2>&1 | tee -a "$LOG"

      - name: Prebuild native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean 2>&1 | tee -a "$LOG"

      - name: Build release APK (arm64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tail -n 400 | tee -a "$LOG"

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" together-${{ github.run_number }}.apk
          gh release create "apk-${{ github.run_number }}" together-${{ github.run_number }}.apk build.log \
            --title "TOGETHER APK #${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Supabase configured: ${{ env.EXPO_PUBLIC_SUPABASE_URL != '' }}" \
            --prerelease

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          tail -n 3000 build.log > build-failed.log
          gh release create "apk-failed-${{ github.run_number }}" build-failed.log \
            --title "APK build failed #${{ github.run_number }}" --notes "Commit ${{ github.sha }}" --prerelease
